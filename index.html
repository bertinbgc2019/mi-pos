<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Net Punto de Venta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-[#1b2a4a] text-white min-h-screen flex flex-col font-sans select-none">

  <!-- CABECERA SUPERIOR -->
  <header class="bg-[#1b2a4a] px-6 py-2 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🛒</span>
        <div class="flex flex-col">
          <h1 class="text-2xl font-black tracking-wider leading-none">G-Net</h1>
          <span class="text-[10px] tracking-widest text-gray-300 font-mono">o-o-o</span>
        </div>
      </div>

      <nav class="flex items-center gap-1.5">
        <button onclick="cambiarModulo('ventas')" id="btn-tab-ventas" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>🛒</span> F1 Ventas
        </button>
        <button onclick="cambiarModulo('creditos')" id="btn-tab-creditos" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>💲</span> F2 Créditos
        </button>
        <button onclick="cambiarModulo('clientes')" id="btn-tab-clientes" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>👥</span> F3 Clientes
        </button>
        <button onclick="cambiarModulo('productos')" id="btn-tab-productos" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>📦</span> F4 Productos
        </button>
        <button onclick="cambiarModulo('inventario')" id="btn-tab-inventario" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>📋</span> F5 Inventario
        </button>
        <button onclick="cambiarModulo('compras')" id="btn-tab-compras" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>🚚</span> Compras
        </button>
        <button onclick="cambiarModulo('reportes')" id="btn-tab-reportes" class="tab-btn bg-white text-slate-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-2 text-xs shadow hover:bg-gray-100">
          <span>📊</span> Reportes
        </button>
      </nav>
    </div>

    <div class="flex items-center gap-2 font-bold text-sm">
      <span>(BERTIN GARCIA CRUZ)</span>
      <div class="w-8 h-8 rounded-full bg-blue-100 text-slate-900 flex items-center justify-center font-bold">👤</div>
    </div>
  </header>

  <div class="bg-[#1b2a4a] px-6 py-1 font-bold text-sm tracking-wide text-gray-200 border-b border-slate-700">
    VENTA-TICKET 1
  </div>

  <main class="flex-1 flex flex-col relative p-3">

    <!-- MÓDULO 1: VENTAS - DISEÑO COMPLETO -->
<section id="modulo-ventas" class="flex-1 flex flex-col bg-[#1b2a4a] p-3 gap-2">
  
  <!-- BARRA SUPERIOR DE VENTAS -->
  <div class="flex items-center gap-3 bg-[#1b2a4a] p-2 rounded-lg">
    <!-- IMAGEN DEL PRODUCTO GRANDE -->
    <div class="w-24 h-24 bg-white rounded-lg flex items-center justify-center border-2 border-white/40">
      <span class="text-xs font-bold text-center text-gray-600">IMAGEN DEL<br>PRODUCTO</span>
    </div>
    
    <!-- CAMPO DE PRODUCTO -->
    <div class="flex items-center gap-2 flex-1">
      <label class="font-bold text-lg">PRODUCTO:</label>
      <input 
        type="text" 
        id="barcode-input" 
        placeholder="(CAMPO DE CODIGO PRODUCTO)" 
        class="flex-1 px-4 py-2 text-black font-bold rounded-lg border-2 border-white/40 focus:outline-none focus:border-blue-400"
        onkeydown="evaluarBusquedaVentas(event)"
        autocomplete="off"
      >
      <button 
        type="button" 
        onclick="abrirCamaraEscanerVenta()" 
        class="bg-white text-[#1b2a4a] px-4 py-2 rounded-lg font-bold hover:bg-gray-200 shadow flex items-center gap-2"
      >
        📷
      </button>
    </div>
    
    <!-- BOTONES SUPERIORES -->
    <div class="flex gap-2">
      <button onclick="vaciarCarrito()" class="bg-white text-[#1b2a4a] px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 shadow">DEL Borrar carrito</button>
      <button class="bg-white text-[#1b2a4a] px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 shadow">💰 F11 Mayoreo</button>
      <button class="bg-white text-[#1b2a4a] px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 shadow">📥 F7 Entradas</button>
      <button class="bg-white text-[#1b2a4a] px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 shadow"> F8 Salidas</button>
      <button class="bg-white text-[#1b2a4a] px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 shadow">🔍 F9 Verificador</button>
    </div>
  </div>
  
  <!-- CONTENIDO PRINCIPAL (SIDEBAR + TABLA) -->
  <div class="flex-1 flex gap-3 overflow-hidden">
    
    <!-- PANEL IZQUIERDO - BUSCADOR Y PRODUCTOS -->
    <div class="w-72 flex flex-col gap-2">
      <!-- BUSCAR PRODUCTO -->
      <div class="bg-white rounded-lg p-2">
        <div class="flex gap-2">
          <label class="font-bold text-[#1b2a4a] text-sm whitespace-nowrap">BUSCAR<br>PRODUCTO:</label>
          <input 
            type="text" 
            id="buscador-productos" 
            class="flex-1 px-2 py-1 text-black text-sm rounded border border-gray-400 focus:outline-none focus:border-blue-500"
            oninput="buscarProductosGrid(this.value)"
          >
        </div>
      </div>
      
      <!-- GRID DE PRODUCTOS (12 botones) -->
      <div class="flex-1 bg-white rounded-lg p-2 overflow-y-auto">
        <div class="grid grid-cols-3 gap-2" id="grid-productos-ventas">
          <!-- Los productos se generan dinámicamente aquí -->
          <button class="aspect-square bg-gray-100 border-2 border-[#1b2a4a] rounded-lg flex flex-col items-center justify-center hover:bg-blue-50 transition">
            <span class="text-xs font-bold text-center text-[#1b2a4a] px-1">IMAGEN DEL<br>PRODUCTO</span>
          </button>
          <button class="aspect-square bg-gray-100 border-2 border-[#1b2a4a] rounded-lg flex flex-col items-center justify-center hover:bg-blue-50 transition">
            <span class="text-xs font-bold text-center text-[#1b2a4a] px-1">IMAGEN DEL<br>PRODUCTO</span>
          </button>
          <button class="aspect-square bg-gray-100 border-2 border-[#1b2a4a] rounded-lg flex flex-col items-center justify-center hover:bg-blue-50 transition">
            <span class="text-xs font-bold text-center text-[#1b2a4a] px-1">IMAGEN DEL<br>PRODUCTO</span>
          </button>
          <button class="aspect-square bg-gray-100 border-2 border-[#1b2a4a] rounded-lg flex flex-col items-center justify-center hover:bg-blue-50 transition">
            <span class="text-xs font-bold text-center text-[#1b2a4a] px-1">IMAGEN DEL<br>PRODUCTO</span>
          </button>
          <button class="aspect-square bg-gray-100 border-2 border-[#1b2a4a] rounded-lg flex flex-col items-center justify-center hover:bg-blue-50 transition">
            <span class="text-xs font-bold text-center text-[#1b2a4a] px-1">IMAGEN DEL<br>PRODUCTO</span>
          </button>
          <button class="aspect-square bg-gray-100 border-2 border-[#1b2a4a] rounded-lg flex flex-col items-center justify-center hover:bg-blue-50 transition">
            <span class="text-xs font-bold text-center text-[#1b2a4a] px-1">IMAGEN DEL<br>PRODUCTO</span>
          </button>
          <button class="aspect-square bg-gray-100 border-2 border-[#1
    <!-- MÓDULO 2: PRODUCTOS (Se mantiene tu código original) -->
    <section id="modulo-productos" class="hidden flex-1 flex flex-col p-4">
      <div class="flex flex-1 gap-6">
        <div class="w-48 flex flex-col gap-2" id="contenedor-subtabs-producto">
          <button onclick="cambiarSubTabProducto('nuevo')" id="subtab-nuevo" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all bg-blue-600 text-white shadow">NUEVO</button>
          <button onclick="cambiarSubTabProducto('modificar')" id="subtab-modificar" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">MODIFICAR</button>
          <button onclick="cambiarSubTabProducto('eliminar')" id="subtab-eliminar" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">ELIMINAR</button>
          <button onclick="cambiarSubTabProducto('departamentos')" id="subtab-departamentos" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">DEPARTAMENTOS</button>
          <button onclick="cambiarSubTabProducto('ventas-periodo')" id="subtab-ventas-periodo" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">VENTAS POR PERIODO</button>
          <button onclick="cambiarSubTabProducto('promociones')" id="subtab-promociones" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">PROMOCIONES</button>
          <button onclick="cambiarSubTabProducto('importar')" id="subtab-importar" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">IMPORTAR</button>
          <button onclick="cambiarSubTabProducto('catalogo')" id="subtab-catalogo" type="button" class="subtab-btn w-full text-left px-3 py-2 font-bold border border-white/40 rounded transition-all hover:bg-slate-700 text-gray-200">CATÁLOGO</button>
        </div>

        <div id="subvista-producto-formulario" class="flex-1 flex gap-8 items-start">
          <form id="form-producto" onsubmit="guardarProducto(event)" class="flex-1 flex flex-col gap-2 text-sm max-w-xl">
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Código de Barras:</label>
              <input type="text" id="prod-codigo" required oninput="verificarCodigoExistente(this.value)" class="flex-1 px-2 py-1 text-black rounded border font-mono font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
              <button type="button" onclick="abrirCamaraEscaner()" class="bg-white p-1.5 rounded text-black hover:bg-gray-200 shadow active:scale-95 transition" title="Escanear con cámara">📷</button>
            </div>
            <div id="alerta-codigo-existente" class="hidden text-xs text-yellow-300 font-bold ml-36 bg-yellow-900/50 p-1.5 rounded border border-yellow-500">⚠️ ¡Aviso! Este código ya existe en el catálogo.</div>
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Descripción:</label>
              <input type="text" id="prod-nombre" required class="flex-1 px-2 py-1 text-black rounded border">
            </div>
            <div class="flex items-center gap-2 pl-36">
              <label class="flex items-center gap-1"><input type="radio" name="tipo_venta" value="unidad" checked> Por Unidad/Pza</label>
              <label class="flex items-center gap-1 ml-4"><input type="radio" name="tipo_venta" value="granel"> A Granel</label>
            </div>
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Precio Costo:</label>
              <input type="number" step="0.01" id="prod-costo" value="0.00" oninput="calcularPrecios()" class="w-32 px-2 py-1 text-black text-right rounded border">
            </div>
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Ganancia:</label>
              <input type="number" step="0.1" id="prod-ganancia" value="0.0" oninput="calcularPrecios()" class="w-32 px-2 py-1 text-black text-right rounded border">%
            </div>
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Precio Venta:</label>
              <input type="number" step="0.01" id="prod-precio" value="0.00" class="w-32 px-2 py-1 text-black text-right rounded border">
            </div>
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Precio Mayoreo:</label>
              <input type="number" step="0.01" id="prod-mayoreo" value="0.00" class="w-32 px-2 py-1 text-black text-right rounded border">
            </div>
            <div class="flex items-center gap-2">
              <label class="w-36 font-bold text-right">Departamento:</label>
              <select id="prod-depto" class="flex-1 px-2 py-1 text-black rounded border">
                <option value="">Seleccionar Departamento</option>
                <option value="Abarrotes">Abarrotes</option>
                <option value="Papelería">Papelería</option>
              </select>
            </div>
            <div class="flex items-center gap-2 mt-1">
              <label class="w-36 font-bold text-right">Utiliza Inventario:</label>
              <input type="checkbox" id="prod-usa-inv" checked>
            </div>
            <div class="flex flex-col gap-2">
              <div class="flex items-center gap-2">
                <label class="w-36 font-bold text-right">Hay:</label>
                <input type="number" id="prod-stock" value="0" class="w-24 px-2 py-1 text-black text-right rounded border">
              </div>
              <div class="flex items-center gap-2">
                <label class="w-36 font-bold text-right">Mínimo:</label>
                <input type="number" id="prod-min" value="0" class="w-24 px-2 py-1 text-black text-right rounded border">
              </div>
              <div class="flex items-center gap-2">
                <label class="w-36 font-bold text-right">Máximo:</label>
                <input type="number" id="prod-max" value="0" class="w-24 px-2 py-1 text-black text-right rounded border">
              </div>
            </div>
            <div class="flex gap-4 justify-center mt-4">
              <button type="submit" class="bg-white text-black font-bold px-6 py-2 rounded shadow hover:bg-gray-100">GUARDAR</button>
              <button type="button" onclick="limpiarFormularioProducto()" class="bg-white text-red-600 font-bold px-6 py-2 rounded shadow hover:bg-gray-100">CANCELAR</button>
            </div>
          </form>

          <div class="w-64 flex flex-col items-center justify-center p-4 border-2 border-dashed border-gray-400 rounded-xl bg-[#161f48] min-h-[250px] relative overflow-hidden group">
            <input type="file" id="input-prod-imagen" accept="image/*" class="hidden" onchange="procesarImagenProducto(event)">
            <div id="contenedor-placeholder-img" class="flex flex-col items-center justify-center cursor-pointer" onclick="document.getElementById('input-prod-imagen').click()">
              <div class="text-6xl text-gray-400 mb-2">🖼️</div>
              <span class="text-sm font-semibold hover:underline text-center">Cargar Imagen de Producto...</span>
            </div>
            <div id="contenedor-preview-img" class="hidden absolute inset-0 w-full h-full bg-[#161f48] flex flex-col items-center justify-center">
              <img id="img-preview" src="" alt="Vista previa" class="w-full h-full object-cover">
              <button type="button" onclick="quitarImagenProducto()" class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-7 h-7 flex items-center justify-center font-bold shadow hover:bg-red-700">✕</button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL DE LECTURA DE CÁMARA (ESCANER) -->
  <div id="modal-escaner-camara" class="hidden fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-white text-slate-900 rounded-xl max-w-md w-full p-4 flex flex-col gap-4 shadow-2xl border border-gray-300">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg flex items-center gap-2">📷 Escanear Código de Barras</h3>
        <button type="button" onclick="cerrarCamaraEscaner()" class="text-gray-500 hover:text-black font-bold text-2xl">✕</button>
      </div>
      <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[250px]"></div>
      <button type="button" onclick="cerrarCamaraEscaner()" class="bg-slate-200 text-slate-800 font-bold py-2 rounded-lg hover:bg-slate-300">Cancelar</button>
    </div>
  </div>

  <!-- SCRIPTS (Orden importante: router primero) -->
  <script src="js/router.js"></script>
  <script src="js/modulos/ventas.js"></script>
  <script src="js/modulos/productos.js"></script>
  <script src="js/modulos/cobro.js"></script>
</body>
</html>
