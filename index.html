<!-- SECCIÓN PRODUCTOS -->
<div id="modulo-productos" class="hidden flex-1 flex flex-col bg-[#1e295d] text-white">
  
  <!-- Subcabecera / Menú Lateral y Formulario -->
  <div class="flex flex-1 p-4 gap-4">
    
    <!-- Menú Lateral Izquierdo -->
    <div class="w-48 flex flex-col gap-2">
      <button onclick="cambiarSubTabProducto('nuevo')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700 active-subtab">NUEVO</button>
      <button onclick="cambiarSubTabProducto('modificar')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">MODIFICAR</button>
      <button onclick="cambiarSubTabProducto('eliminar')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">ELIMINAR</button>
      <button onclick="cambiarSubTabProducto('departamentos')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">DEPARTAMENTOS</button>
      <button onclick="cambiarSubTabProducto('ventas-periodo')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">VENTAS POR PERIODO</button>
      <button onclick="cambiarSubTabProducto('promociones')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">PROMOCIONES</button>
      <button onclick="cambiarSubTabProducto('importar')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">IMPORTAR</button>
      <button onclick="cambiarSubTabProducto('catalogo')" class="btn-subtab w-full py-2 px-3 border border-white rounded font-bold text-left hover:bg-slate-700">CATÁLOGO</button>
    </div>

    <!-- Panel Principal Variable según Subtab -->
    <div class="flex-1 flex gap-6 items-start bg-[#1e295d] p-4 rounded">
      
      <!-- FORMULARIO NUEVO / MODIFICAR -->
      <form id="form-producto" onsubmit="guardarProducto(event)" class="flex-1 flex flex-col gap-2 text-sm max-w-xl">
        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Código de Barras:</label>
          <input type="text" id="prod-codigo" required class="flex-1 px-2 py-1 text-black rounded border">
          <button type="button" class="bg-gray-200 p-1.5 rounded text-black">📷</button>
        </div>

        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Descripción:</label>
          <input type="text" id="prod-nombre" required class="flex-1 px-2 py-1 text-black rounded border">
        </div>

        <div class="flex items-center gap-2 pl-36">
          <label class="flex items-center gap-1"><input type="radio" name="tipo_venta" value="unidad" checked> Por Unidad/Pza</label>
          <label class="flex items-center gap-1 ml-4"><input type="radio" name="tipo_venta" value="granel"> A Granel</label>
        </div>

        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Precio Costo:</label>
          <input type="number" step="0.01" id="prod-costo" value="0.00" oninput="calcularPrecios()" class="w-32 px-2 py-1 text-black text-right rounded border">
        </div>

        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Ganancia:</label>
          <input type="number" step="0.1" id="prod-ganancia" value="0.0" oninput="calcularPrecios()" class="w-32 px-2 py-1 text-black text-right rounded border">%
        </div>

        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Precio Venta:</label>
          <input type="number" step="0.01" id="prod-precio" value="0.00" class="w-32 px-2 py-1 text-black text-right rounded border">
        </div>

        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Precio Mayoreo:</label>
          <input type="number" step="0.01" id="prod-mayoreo" value="0.00" class="w-32 px-2 py-1 text-black text-right rounded border">
        </div>

        <div class="flex items-center gap-2">
          <label class="w-36 font-bold text-right">Departamento:</label>
          <select id="prod-depto" class="flex-1 px-2 py-1 text-black rounded border">
            <option value="">Seleccionar Departamento</option>
          </select>
        </div>

        <div class="flex items-center gap-2 mt-2">
          <label class="w-36 font-bold text-right">Utiliza Inventario:</label>
          <input type="checkbox" id="prod-usa-inv" checked onchange="toggleInventarioCampos(this.checked)">
        </div>

        <div id="campos-inventario" class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <label class="w-36 font-bold text-right">Hay:</label>
            <input type="number" id="prod-stock" value="0" class="w-24 px-2 py-1 text-black text-right rounded border">
          </div>
          <div class="flex items-center gap-2">
            <label class="w-36 font-bold text-right">Mínimo:</label>
            <input type="number" id="prod-min" value="0" class="w-24 px-2 py-1 text-black text-right rounded border">
          </div>
          <div class="flex items-center gap-2">
            <label class="w-36 font-bold text-right">Máximo:</label>
            <input type="number" id="prod-max" value="0" class="w-24 px-2 py-1 text-black text-right rounded border">
          </div>
        </div>

        <!-- Botones Guardar / Cancelar -->
        <div class="flex gap-4 justify-center mt-6">
          <button type="submit" class="bg-white text-black font-bold px-6 py-2 rounded shadow hover:bg-gray-100">GUARDAR</button>
          <button type="button" onclick="limpiarFormularioProducto()" class="bg-white text-red-600 font-bold px-6 py-2 rounded shadow hover:bg-gray-100">CANCELAR</button>
        </div>
      </form>

      <!-- Cuadro de Carga de Imagen -->
      <div class="w-64 flex flex-col items-center justify-center p-6 border-2 border-dashed border-gray-400 rounded bg-[#161f48]">
        <div class="text-6xl text-gray-400 mb-2">🖼️</div>
        <button type="button" class="text-sm font-semibold hover:underline">Cargar Imagen de Producto...</button>
      </div>

    </div>
  </div>
</div>
